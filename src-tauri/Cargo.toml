[package]
name = "clutchblox"
version = "1.4.0"
description = "ClutchBlox — Competitive Roblox Client"
edition = "2021"

[lib]
name = "clutchblox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
directories = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
codegen-units = 1
incremental = false

[profile.dev.build-override]
codegen-units = 1
incremental = false

[profile.release]
codegen-units = 1
incremental = false

[profile.release.build-override]
codegen-units = 1
incremental = false
